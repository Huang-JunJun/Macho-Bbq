version: "3.9"

services:
  bbq-server:
    container_name: bbq-server
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:18-alpine}
    env_file:
      - ./env/.env.server
    volumes:
      - ./data/uploads:/app/apps/server/uploads
    restart: always
    networks:
      - bbq-net

  bbq-nginx:
    container_name: bbq-nginx
    image: nginx:1.25-alpine
    depends_on:
      - bbq-server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./data/html:/usr/share/nginx/html:ro
    restart: always
    networks:
      - bbq-net

networks:
  bbq-net:
    name: bbq-net
