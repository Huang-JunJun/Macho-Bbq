# 1. 必须在 http 块内定义映射关系（处理 Connection 头部）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name wjlbbq.online www.wjlbbq.online;

    # 强制跳转 HTTPS
    return 301 https://www.wjlbbq.online$request_uri;
}

server {
    listen 443 ssl;
    # 如果 Nginx 版本支持且需要，保留 http2；如果报错依旧，建议先关闭
    http2 on;

    server_name wjlbbq.online www.wjlbbq.online;

    # 域名重定向（统一到 www）
    if ($host = 'wjlbbq.online') {
        return 301 https://www.wjlbbq.online$request_uri;
    }

    # SSL 证书配置
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # SSL 性能优化
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;
    root /usr/share/nginx/html;
    index index.html;

    # --- 通用代理头配置 (减少重复代码) ---
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 1. 静态资源与普通 API
    location /api/ {
        proxy_pass http://bbq-server:3000/;
    }

    location /uploads/ {
        proxy_pass http://bbq-server:3000/uploads/;
    }

    # 2. WebSocket 代理配置 (关键部分)
    # 使用 ^~ 提高匹配优先级，防止被其他正则干扰
    location ^~ /admin/ws {
        proxy_pass http://bbq-server:3000/admin/ws;

        # 核心：必须使用 HTTP/1.1
        proxy_http_version 1.1;

        # 核心：传递 Upgrade 头部
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 扩展头部：传递子协议（如 JWT 验证可能用到）
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

        # 稳定性优化
        proxy_buffering off;         # 禁用缓存，实时传输
        proxy_read_timeout 3600s;    # 增加超时时间，防止长连接意外断开
        proxy_send_timeout 3600s;

        # 禁用压缩，防止破坏 WebSocket 帧
        gzip off;
    }

    # 复用配置处理其他 WS 路径
    location ^~ /ws/admin {
        proxy_pass http://bbq-server:3000/ws/admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location ^~ /mp/ws {
        proxy_pass http://bbq-server:3000/mp/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # 前端路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }
}